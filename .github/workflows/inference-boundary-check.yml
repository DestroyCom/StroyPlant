name: Inference engine species-blindness check

on:
  pull_request:
    paths:
      - 'backend/src/inference/**'
      - 'backend/scripts/checkInferenceBoundary.ts'
      - '.github/workflows/inference-boundary-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/inference/**'
      - 'backend/scripts/checkInferenceBoundary.ts'
      - '.github/workflows/inference-boundary-check.yml'

permissions:
  contents: read

jobs:
  check-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx tsx scripts/checkInferenceBoundary.ts
        working-directory: backend
      - run: pnpm exec prisma generate
        working-directory: backend
      - run: pnpm test
        working-directory: backend
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: backend
      - run: npx biome check src/inference
        working-directory: backend
