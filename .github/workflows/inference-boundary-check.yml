name: Inference engine species-blindness check

on:
  pull_request:
    paths:
      - 'backend/src/inference/**'
      - 'backend/scripts/checkInferenceBoundary.ts'
      - '.github/workflows/inference-boundary-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/inference/**'
      - 'backend/scripts/checkInferenceBoundary.ts'
      - '.github/workflows/inference-boundary-check.yml'

permissions:
  contents: read

jobs:
  check-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx tsx scripts/checkInferenceBoundary.ts
        working-directory: backend
      - run: pnpm exec prisma generate
        working-directory: backend
      - run: pnpm test
        working-directory: backend
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: backend
      - run: npx biome check src/inference
        working-directory: backend
