name: Inference engine species-blindness check

on:
  pull_request:
    paths:
      - 'backend/src/inference/**'
      - 'backend/scripts/checkInferenceBoundary.ts'
      - '.github/workflows/inference-boundary-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/inference/**'
      - 'backend/scripts/checkInferenceBoundary.ts'
      - '.github/workflows/inference-boundary-check.yml'

jobs:
  check-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx tsx scripts/checkInferenceBoundary.ts
        working-directory: backend
      - run: pnpm exec prisma generate
        working-directory: backend
      - run: pnpm test
        working-directory: backend
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: backend
      - run: npx biome check src/inference
        working-directory: backend
